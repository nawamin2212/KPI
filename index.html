<script>
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=x=>Number(x||0).toLocaleString('th-TH',{maximumFractionDigits:1});
let DB={staff:[],tasks:[],reviews:[],settings:{}}, selected=null, filter=''; const cats={management:['การบริหารจัดการ','ความเป็นผู้นำ','การสื่อสารและทำงานร่วมกับผู้อื่น'],performance:['ความสามารถในสายงาน','ความเชี่ยวชาญ','คุณภาพผลงาน'],responsibility:['ความตั้งใจและมุ่งมั่น','ความรับผิดชอบ','ทำงานให้ลุล่วง'],behavior:['ระเบียบวินัย','การมีส่วนร่วมในกิจกรรมส่วนรวม','ความภักดีต่อองค์กร']}; const catLabel={management:'Management Skill · การบริหารจัดการ',performance:'Performance · ผลงาน',responsibility:'Responsibility · ความรับผิดชอบ',behavior:'Behavior · พฤติกรรม'};
const APP_VERSION='ASA-FAST-7';
const DEFAULT_API='https://script.google.com/macros/s/AKfycbysThlW8XCHIQA8nCPJwysmbW7MAxnGpWklX1QFltCRIh9-rqNYDwAXWU6FQdwxUHH3Zw/exec';
let API_URL=DEFAULT_API,AUTH_TOKEN='';
function randomId(){const a=new Uint8Array(32);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function jsonp(params){return new Promise((resolve,reject)=>{
 const cb='asaCb_'+randomId(),script=document.createElement('script');
 const cleanup=()=>{clearTimeout(timer);script.remove();delete window[cb]};
 const timer=setTimeout(()=>{cleanup();reject(Error('เชื่อมต่อไม่สำเร็จ: ตรวจ URL /exec และ Deploy เป็น Execute as: Me, Who has access: Anyone'))},20000);
 window[cb]=r=>{cleanup();resolve(r)};script.onerror=()=>{cleanup();reject(Error('API ไม่ตอบกลับเป็นข้อมูล กรุณาแทนที่ Code.gs ทั้งไฟล์และ Deploy เวอร์ชันใหม่ (Me / Anyone)'))};
 script.referrerPolicy='no-referrer';script.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(script);
})}
async function postCommand(action,extra){
 const rid=randomId(),body=JSON.stringify({action,rid,...extra});
 // Send exactly one write. Prefer its direct reply; fall back to its receipt.
 const direct=fetch(API_URL,{method:'POST',mode:'cors',credentials:'omit',headers:{'Content-Type':'text/plain;charset=UTF-8'},body}).then(r=>r.json()).then(r=>typeof r.ok==='boolean'?r:new Promise(()=>{})).catch(()=>new Promise(()=>{}));
 const end=Date.now()+65000;
 while(Date.now()<end){
  const early=await Promise.race([direct,new Promise(r=>setTimeout(()=>r(null),1000))]);if(early)return early;
  const reply=await Promise.race([direct,jsonp({action:'result',rid,token:AUTH_TOKEN}).catch(()=>({pending:true}))]);if(!reply.pending)return reply;
 }
 throw Error('ยังไม่ได้รับผลยืนยัน กรุณากดอัปเดตข้อมูลเพื่อตรวจสอบก่อนส่งซ้ำ');
}
let busyCount=0;
function busyStart(message='กำลังบันทึกข้อมูล…'){
 busyCount++;$('#busyTitle').textContent=message;if(!$('#busyDialog').open)$('#busyDialog').showModal();
}
function busyEnd(){busyCount=Math.max(0,busyCount-1);if(!busyCount&&$('#busyDialog').open)$('#busyDialog').close()}
function upsert(list,item){const i=list.findIndex(x=>x.id===item.id);if(i<0)list.push(item);else list[i]={...list[i],...item}}
function applySaved(name,args,data){
 if(name==='saveStaff'){const {resultPin,...publicStaff}=args[0];upsert(DB.staff,{...publicStaff,id:data.id})}
 if(name==='saveTask')upsert(DB.tasks,{...args[0],...data});
 if(name==='deleteTask')DB.tasks=DB.tasks.filter(x=>x.id!==args[0]);
 if(name==='deleteStaff'){DB.staff=DB.staff.filter(x=>x.id!==args[0]);DB.tasks=DB.tasks.filter(x=>x.staffId!==args[0]);DB.reviews=DB.reviews.filter(x=>x.targetId!==args[0]);compared.delete(args[0])}
 
 if(name==='saveSettings'){DB.settings['น้ำหนักกรรมการ (%)']=args[0].board;DB.settings['น้ำหนักเจ้าหน้าที่ (%)']=args[0].staff}
 if(name==='savePhoto'){const s=staff(args[0]);s.photoId=data;s.photo=args[1];photoCache.set(data,args[1])}
 if(['saveStaff','saveTask','savePhoto','saveReview','saveSettings','deleteStaff','deleteTask','saveAdjustment','setPrivatePin'].includes(name)){lastSaved=new Date();toast('บันทึกข้อมูลแล้ว')}
}
async function rpc(name,...args){
 busyStart(['getAppData','getAdminRecords','getPrivateResult'].includes(name)?'กำลังตรวจสอบสิทธิ์และโหลดข้อมูล…':name==='adminLogin'?'กำลังตรวจสอบรหัสผู้ดูแล…':name.startsWith('delete')?'กำลังลบข้อมูล…':'กำลังบันทึกข้อมูล…');
 try{
  const r=name==='getAppData'?await jsonp({action:name,token:AUTH_TOKEN}):await postCommand(name,{token:AUTH_TOKEN,args});
  if(!r.ok){if(String(r.error).startsWith('ADMIN:'))DB.isAdmin=false;if(String(r.error).startsWith('AUTH:')){AUTH_TOKEN='';if($('#dlg').open)$('#dlg').close();loginScreen(r.error)}throw Error(r.error||'คำสั่งไม่สำเร็จ')}
  if(r.version!==APP_VERSION)throw Error('กรุณาอัปเดต Code.gs และ Deploy เวอร์ชัน ASA-FAST-7');
  if(name!=='getAppData')applySaved(name,args,r.data);
  return r.data;
 }finally{busyEnd()}
}
async function refreshData(){try{DB=await rpc('getAppData');lastSaved=new Date();render();toast('อัปเดตข้อมูลล่าสุดแล้ว')}catch(e){toast(e.message)}}

function loginScreen(message=''){
 $('#settingsButton').hidden=true;$('#logoutButton').hidden=true;
 $('#app').innerHTML=`<section class="panel" style="max-width:520px;margin:40px auto"><h2>เข้าสู่ระบบ</h2><p>ใส่รหัสผ่านเพื่อดูเนื้องานและประเมินบุคลากร</p><form id="loginForm"><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required><details style="margin:16px 0"><summary>ตั้งค่าการเชื่อมต่อ</summary><label for="apiUrl">Apps Script Web App URL (/exec)</label><input id="apiUrl" type="url" value="${esc(API_URL)}" required></details><button id="loginButton" class="primary" type="submit">เข้าสู่ระบบ</button><p id="loginError" role="alert" style="color:var(--red)">${esc(message)}</p></form><small>เวอร์ชัน ${APP_VERSION}</small></section>`;
 $('#loginForm').onsubmit=login;$('#password').focus();
}
async function login(event){
 event.preventDefault();busyStart('กำลังเข้าสู่ระบบ…');const button=$('#loginButton');button.disabled=true;$('#loginError').textContent='กำลังเชื่อมต่อ…';
 try{
  const url=$('#apiUrl').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url))throw Error('กรุณาใส่ Apps Script URL ที่ลงท้าย /exec');API_URL=url;
  const r=await postCommand('login',{password:$('#password').value});if(!r.ok)throw Error(r.error);if(r.version!==APP_VERSION)throw Error('กรุณาแทนที่ Code.gs และ Deploy > New version เป็น '+APP_VERSION);AUTH_TOKEN=r.data.token;$('#password').value='';DB=r.data.appData;$('#settingsButton').hidden=false;$('#logoutButton').hidden=false;render();
 }catch(e){const target=$('#loginError');if(target)target.textContent=e.message}finally{button.disabled=false;busyEnd()}
}
function logout(){AUTH_TOKEN='';afterAdmin=null;$('#dlg').innerHTML='';photoCache.clear();photoQueue.length=0;compared.clear();screen='people';DB={staff:[],tasks:[],reviews:[],settings:{}};selected=null;filter='';if($('#dlg').open)$('#dlg').close();loginScreen()}
function init(){loginScreen()}
function year(){return Number($('#year').value)} function canEdit(id){return !!DB.isAdmin||DB.viewerStaffId===id} function staff(id){return DB.staff.find(s=>s.id===id)} function personTasks(id){return DB.tasks.filter(t=>t.staffId===id&&t.year===year())} function taskHours(t){if(t.durationMonths!=null&&t.durationMonths!==''){const m=Number(t.durationMonths);if(!Number.isFinite(m)||m<=0||m>12||t.hours==null||t.hours===''||t.count==null||t.count==='')return null;return Math.round(Number(t.hours)*Number(t.count)*m*100)/100;}if(t.hoursYear!==''&&t.hoursYear!=null&&Number.isFinite(Number(t.hoursYear)))return Number(t.hoursYear);if(t.hours==null||t.hours===''||t.count==null||t.count===''||!t.frequency)return null;let m={day:260,week:52,month:12,quarter:4,year:1,twoYears:.5,once:1}[t.frequency];if(t.frequency==='nweeks')m=52/(Number(t.everyWeeks)||1);return m==null?null:Number(t.hours)*Number(t.count)*m}

function personSummary(id){let ts=personTasks(id),filled=ts.map(taskHours).filter(Number.isFinite);return {projects:new Set(ts.filter(t=>t.project.trim()).map(t=>t.project.trim().toLowerCase())).size,hours:filled.reduce((a,b)=>a+b,0),complete:filled.length,total:ts.length}}
function weights(){return {board:Number(DB.settings['น้ำหนักกรรมการ (%)']??30),staff:Number(DB.settings['น้ำหนักเจ้าหน้าที่ (%)']??70)}}
let screen='people',deptFilter='',chartDepartment='',compared=new Set(),lastSaved=null;
const photoCache=new Map(),photoPending=new Set(),photoQueue=[];let photoWorkers=0,photoObserver;
const colors=['#377eb8','#ed8b32','#31988a','#9364b3','#d65c66','#b29a35','#5b7f3c','#b96f9b','#587d93','#9d6c47','#7471c5','#46a5b3'];
const chartColors={};
function paletteColor(index){return colors[index]||`hsl(${(index*137.508)%360} 58% 43%)`}
function colorFor(label,scope='category'){const map=chartColors[scope]||(chartColors[scope]=new Map());if(!map.has(label))map.set(label,paletteColor(map.size));return map.get(label)}
function departments(){return [...new Set(DB.staff.map(s=>s.department||'ไม่ระบุฝ่าย'))].sort((a,b)=>a.localeCompare(b,'th'))}
function avatar(s){const photo=s.photo||photoCache.get(s.photoId);return `<div class="avatar" data-photo-id="${esc(s.photoId||'')}">${photo?`<img src="${esc(photo)}" alt="รูป ${esc(s.name)}">`:`<span>${esc(s.name.slice(0,1))}</span>`}</div>`}
function observePhotos(){
 if(photoObserver)photoObserver.disconnect();
 photoObserver=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){const id=e.target.dataset.photoId;photoObserver.unobserve(e.target);if(id&&!photoCache.has(id)&&!photoPending.has(id)){photoPending.add(id);photoQueue.push(id);queueMicrotask(runPhotoQueue)}}},{rootMargin:'120px'});
 document.querySelectorAll('[data-photo-id]').forEach(el=>photoObserver.observe(el));
}
async function runPhotoQueue(){
 if(photoWorkers>=1||!photoQueue.length||!AUTH_TOKEN)return;
 const ids=photoQueue.splice(0,4);photoWorkers++;const session=AUTH_TOKEN;
 try{const r=await jsonp({action:'getPhotos',ids:JSON.stringify(ids),token:session});if(r.ok&&AUTH_TOKEN===session){for(const id of ids){const data=r.data[id]||'';photoCache.set(id,data);document.querySelectorAll('[data-photo-id]').forEach(el=>{if(el.dataset.photoId===id&&data){const im=document.createElement('img');im.src=data;im.alt='รูปเจ้าหน้าที่';el.replaceChildren(im)}})}}}catch(e){}finally{ids.forEach(id=>photoPending.delete(id));photoWorkers--;runPhotoQueue()}
}
function navigation(){return `<div class="workspace-nav"><div class="tabs" aria-label="หน้าหลัก"><button class="${screen==='people'?'active':''}" onclick="navigate('people')">เจ้าหน้าที่</button><button class="${screen==='overview'?'active':''}" onclick="navigate('overview')">ภาพรวมฝ่าย</button><button class="${screen==='compare'?'active':''}" onclick="navigate('compare')">เปรียบเทียบ <span>${compared.size}/5</span></button></div><button class="quiet" onclick="refreshData()">↻ อัปเดตข้อมูล</button></div>`}
function navigate(page){screen=page;selected=null;render()}
function render(){if(!AUTH_TOKEN)return;if(selected){detail();return}$('#app').innerHTML=navigation()+'<div id="page"></div>';if(screen==='overview')overview();else if(screen==='compare')comparison();else home();observePhotos()}
function home(){
 const total=DB.staff.reduce((a,s)=>a+personSummary(s.id).hours,0);
 $('#page').innerHTML=`<div class="page-heading"><div><div class="eyebrow">PEOPLE & WORKLOAD · ${year()}</div><h2>รู้จักงาน เห็นภาพรวม</h2><p class="muted">เลือกเจ้าหน้าที่เพื่อดูรายละเอียดงาน หรือเพิ่มรายชื่อเพื่อเปรียบเทียบ</p></div><button class="primary" onclick="staffDialog()">＋ เพิ่มเจ้าหน้าที่</button></div><div class="summary"><div class="panel"><small>เจ้าหน้าที่ทั้งหมด</small><b>${DB.staff.length} <em>คน</em></b></div><div class="panel"><small>ฝ่าย / หน่วยงาน</small><b>${departments().length} <em>ฝ่าย</em></b></div><div class="panel"><small>ชั่วโมงงานรวมที่ระบุ</small><b>${fmt(total)} <em>ชม./ปี</em></b></div></div><div class="toolbar searchbar"><input aria-label="ค้นหาเจ้าหน้าที่" placeholder="ค้นหาชื่อ ตำแหน่ง หรือฝ่าย" value="${esc(filter)}" oninput="filter=this.value;renderPeopleCards()"><select aria-label="กรองฝ่าย" onchange="deptFilter=this.value;renderPeopleCards()"><option value="">ทุกฝ่าย</option>${departments().map(d=>`<option ${d===deptFilter?'selected':''}>${esc(d)}</option>`).join('')}</select><span id="peopleCount" class="muted"></span></div><div class="cards" id="peopleGrid"></div>`;renderPeopleCards();
}
function renderPeopleCards(){
 const q=filter.trim().toLowerCase(),list=DB.staff.filter(s=>(!q||[s.name,s.department,s.position].join(' ').toLowerCase().includes(q))&&(!deptFilter||(s.department||'ไม่ระบุฝ่าย')===deptFilter));
 $('#peopleCount').textContent=`${list.length} คน`;
 $('#peopleGrid').innerHTML=list.map(s=>{const x=personSummary(s.id);return `<article class="card"><button class="person-open" onclick="selected='${s.id}';detail()" aria-label="ดูรายละเอียด ${esc(s.name)}">${avatar(s)}<span class="person-name">${esc(s.name)}</span><span class="muted">${esc(s.position||'เจ้าหน้าที่')}</span><span class="department-tag">${esc(s.department||'ไม่ระบุฝ่าย')}</span></button><div class="metrics"><div class="metric"><b>${x.projects}</b><small>โครงการ / งาน</small></div><div class="metric"><b>${fmt(x.hours)}</b><small>ชั่วโมง / ปี</small></div></div><div class="card-footer"><span class="pill ">ผลประเมินส่วนตัว</span><button class="compare-toggle ${compared.has(s.id)?'chosen':''}" onclick="toggleCompare('${s.id}')">${compared.has(s.id)?'✓ เลือกแล้ว':'＋ เทียบ'}</button></div></article>`}).join('')||'<div class="empty">ไม่พบเจ้าหน้าที่ที่ตรงกับการค้นหา</div>';observePhotos();
}
function toggleCompare(id){if(compared.has(id))compared.delete(id);else{if(compared.size>=5){toast('เปรียบเทียบได้สูงสุด 5 คน กรุณานำรายชื่อเดิมออกก่อน');return}compared.add(id)}if(screen==='compare')render();else{renderPeopleCards();document.querySelectorAll('.tabs button:last-child span').forEach(el=>el.textContent=compared.size+'/5')}}
function groupedHours(tasks,key){const m=new Map();for(const t of tasks){const h=taskHours(t);if(h==null||h<=0)continue;const label=key(t)||'ไม่ระบุประเภท';m.set(label,(m.get(label)||0)+h)}return [...m].map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value)}
function donut(items,title,scope='category'){
 const total=items.reduce((a,i)=>a+i.value,0);let offset=0;
 const slices=items.map(i=>{const percent=i.value/total*100;const svg=`<circle cx="60" cy="60" r="46" fill="none" stroke="${colorFor(i.label,scope)}" stroke-width="16" pathLength="100" stroke-dasharray="${percent} ${100-percent}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"><title>${esc(i.label)}: ${fmt(i.value)} ชั่วโมง (${fmt(percent)}%)</title></circle>`;offset+=percent;return svg}).join('');
 return `<div class="chart-layout"><div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(title)} ${fmt(total)} ชั่วโมง"><circle cx="60" cy="60" r="46" fill="none" stroke="#eef1f2" stroke-width="16"/>${slices}</svg><div class="donut-center"><b>${fmt(total)}</b><small>ชั่วโมง / ปี</small></div></div><div class="legend">${items.length?items.map(i=>`<div class="legend-row"><span class="dot" style="background:${colorFor(i.label,scope)}"></span><span>${esc(i.label)}</span><strong>${fmt(i.value)} <small>(${fmt(i.value/total*100)}%)</small></strong></div>`).join(''):'<p class="empty">ยังไม่มีชั่วโมงงานที่นำมาคำนวณได้</p>'}</div></div>`;
}
function coverage(tasks){const n=tasks.filter(t=>taskHours(t)==null).length;return `<p class="chart-note">คำนวณจากชั่วโมงต่อปีที่ระบุ${n?` · ยังขาดข้อมูลเวลา ${n} รายการ`:''} · งานไม่มีเวลาจะไม่นับในสัดส่วนกราฟ</p>`}
function overview(){
 const people=DB.staff.filter(s=>!chartDepartment||(s.department||'ไม่ระบุฝ่าย')===chartDepartment),ids=new Set(people.map(s=>s.id)),tasks=DB.tasks.filter(t=>t.year===year()&&ids.has(t.staffId));
 const all=DB.tasks.filter(t=>t.year===year()&&staff(t.staffId));
 $('#page').innerHTML=`<div class="page-heading"><div><div class="eyebrow">ORGANIZATION OVERVIEW · ${year()}</div><h2>สัดส่วนงานแต่ละฝ่าย</h2><p class="muted">เห็นการกระจายเวลาทำงานทั้งองค์กร และเจาะดูประเภทงานของแต่ละฝ่าย</p></div></div><div class="panel chart-panel"><h3>ชั่วโมงงานรวม แยกตามฝ่าย</h3>${donut(groupedHours(all,t=>staff(t.staffId)?.department||'ไม่ระบุฝ่าย'),'ชั่วโมงงานแต่ละฝ่าย','department')}${coverage(all)}</div><div class="toolbar" style="margin-top:24px"><label for="chartDepartment">ดูประเภทงานของฝ่าย</label><select id="chartDepartment" onchange="chartDepartment=this.value;overview()"><option value="">ทุกฝ่าย</option>${departments().map(d=>`<option ${chartDepartment===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="panel chart-panel"><h3>${esc(chartDepartment||'ทุกฝ่าย')} · ${people.length} คน</h3>${donut(groupedHours(tasks,t=>t.category),'สัดส่วนประเภทงาน')}${coverage(tasks)}</div><div class="panel" style="margin-top:20px"><h3>ชั่วโมงงานรายบุคคลในฝ่ายที่เลือก</h3>${personBars(people)}</div>`;
}
function personBars(people){const rows=people.map(s=>({s,...personSummary(s.id)})),max=Math.max(1,...rows.map(r=>r.hours));return rows.map((r,index)=>`<div class="comparison-row"><div><strong>${esc(r.s.name)}</strong><small>${esc(r.s.department)} · ${r.projects} โครงการ/งาน</small></div><div class="bar-track"><i style="width:${r.hours/max*100}%;background:${paletteColor(index)}"></i></div><b>${fmt(r.hours)} <small>ชม.</small></b></div>`).join('')||'<p class="empty">ยังไม่มีเจ้าหน้าที่ในฝ่ายนี้</p>'}
function comparison(){
 const people=[...compared].map(staff).filter(Boolean);

}

 const s=staff(selected);if(!s){selected=null;render();return}const ts=personTasks(s.id),sum=personSummary(s.id);
 $('#app').innerHTML=`<button class="back quiet" onclick="selected=null;render()">← กลับรายชื่อ</button><section class="panel profile-panel"><div class="personHead">${avatar(s)}<div><span class="department-tag">${esc(s.department)}</span><h2>${esc(s.name)}</h2><p class="muted">${esc(s.position||'')} · ปี ${year()}</p><button onclick="staffDialog('${s.id}')">แก้ไขข้อมูล</button> <button onclick="photoPick('${s.id}')">เปลี่ยนรูป</button></div></div><div class="actions"><button class="primary" onclick="taskDialog('${s.id}')">＋ เพิ่มเนื้องาน</button><button onclick="evaluationDialog('${s.id}','board')">กรรมการประเมิน</button><button onclick="evaluationDialog('${s.id}','staff')">เจ้าหน้าที่ประเมิน</button><button onclick="resultsDialog('${s.id}')">🔒 ดูผลประเมินส่วนตัว</button><button class="danger" onclick="removeStaff('${s.id}')">ลบชื่อ</button></div></section><div class="summary"><div class="panel"><small>โครงการ / งานในปีนี้</small><b>${sum.projects} <em>งาน</em></b></div><div class="panel"><small>ชั่วโมงงานที่ระบุ</small><b>${fmt(sum.hours)} <em>ชม./ปี</em></b></div><div class="panel"><small>ข้อมูลเวลาครบ</small><b>${sum.complete} <em>/ ${sum.total} รายการ</em></b></div></div><section class="panel chart-panel"><h3>สัดส่วนเนื้องาน</h3>${donut(groupedHours(ts,t=>t.category),'สัดส่วนเนื้องานรายบุคคล')}${coverage(ts)}</section><section class="panel" style="margin-top:20px"><div class="topline"><h3>รายการเนื้องาน</h3><small>${ts.length} รายการ</small></div>${ts.map(t=>`<div class="task"><div class="taskHead"><div><span class="department-tag">${esc(t.category||'ไม่ระบุประเภท')}</span><h3>${esc(t.project)}</h3><small>${t.durationMonths!=null?`ระยะเวลาดำเนินงาน ${fmt(t.durationMonths)} เดือน`:esc(t.duration)}</small>${t.details?`<p>${esc(t.details)}</p>`:''}<small>${t.hours!=null?`${fmt(t.hours)} ชั่วโมง/ครั้ง · ${fmt(monthlyCount(t))} ครั้ง/เดือน${t.frequency!=='month'?' (เฉลี่ยจากข้อมูลเดิม)':''}`:'ยังไม่ระบุเวลา'}</small></div><div class="task-actions"><strong>${taskHours(t)==null?'ยังไม่ครบ':fmt(taskHours(t))+' ชม./ปี'}</strong><div><button onclick="taskDialog('${s.id}','${t.id}')">แก้ไข</button> <button class="danger" onclick="removeTask('${t.id}')">ลบ</button></div></div></div></div>`).join('')||'<p class="empty">ยังไม่มีรายการ กดเพิ่มเนื้องานเพื่อเริ่มบันทึก</p>'}</section><section class="panel" style="margin-top:20px"><h3>ผลประเมินส่วนตัว</h3><p class="muted">คะแนนและเกรดเปิดดูได้เฉพาะเจ้าหน้าที่เจ้าของรหัสและผู้ดูแล</p><button onclick="resultsDialog('${s.id}')">กรอกรหัส 6 หลักเพื่อดูผล</button></section>`;observePhotos();
}

function freqLabel(f,n){return ({day:'ทุกวันทำงาน',week:'ทุกสัปดาห์',month:'ทุกเดือน',quarter:'ทุกไตรมาส',year:'ทุกปี',twoYears:'ปีเว้นปี',once:'ครั้งเดียวในปีนี้',nweeks:`ทุก ${n||'?'} สัปดาห์`})[f]||'ยังไม่ระบุ'}
function modal(title,body,footer){let d=$('#dlg');d.innerHTML=`<div class="dlghead"><h2>${title}</h2><button onclick="dlg.close()">✕</button></div><div class="dlgbody">${body}</div><div class="dlgfoot">${footer||'<button onclick="dlg.close()">ปิด</button>'}</div>`;d.showModal()}
function staffDialog(id=''){if(!DB.isAdmin)return adminGate(()=>staffDialog(id));let s=staff(id)||{name:'',position:'',department:'',branch:''};modal(id?'แก้ไขข้อมูลเจ้าหน้าที่':'เพิ่มเจ้าหน้าที่',`<div class="grid"><div><label>ชื่อ-สกุล</label><input id="sn" value="${esc(s.name)}"></div><div><label>ตำแหน่ง</label><input id="sp" value="${esc(s.position)}"></div><div><label>ฝ่าย</label><input id="sd" value="${esc(s.department)}"></div><div><label>สังกัด/สำนักงาน</label><input id="sb" value="${esc(s.branch)}"></div>${!id?'<div><label>รหัสส่วนตัวสำหรับดูผล (6 หลัก) *</label><input id="newResultPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>':''}</div>`,`<button onclick="dlg.close()">ยกเลิก</button><button class="primary" onclick="saveStaffForm('${id}')">บันทึก</button>`)}
async function saveStaffForm(id){try{let s={id:id||crypto.randomUUID(),name:$('#sn').value.trim(),position:$('#sp').value.trim(),department:$('#sd').value.trim(),branch:$('#sb').value.trim()};if(!id){s.resultPin=$('#newResultPin').value;if(!/^\d{6}$/.test(s.resultPin))return toast('กรุณากำหนดรหัสตัวเลข 6 หลัก');}await rpc('saveStaff',s);dlg.close();if(id)detail();else render()}catch(e){toast(e.message)}}
function monthlyCount(t){
 if(t.frequency==='month')return t.count??'';
 const total=taskHours(t);if(total!=null&&Number(t.hours)>0)return Number((total/(Number(t.hours)*12)).toFixed(8));
 const m={day:260,week:52,quarter:4,year:1,twoYears:.5,once:1}[t.frequency]??(t.frequency==='nweeks'?52/(Number(t.everyWeeks)||1):null);
 return m==null?'':Number(((Number(t.count)||0)*m/12).toFixed(8));
}
function suggestedMonths(t){
 if(t.durationMonths!=null)return t.durationMonths;
 const text=String(t.duration||'').trim();const m=text.match(/^(\d+(?:\.\d+)?)\s*(?:เดือน)?$/);
 if(m&&Number(m[1])>0&&Number(m[1])<=12)return Number(m[1]);
 return /^(1\s*ปี|ทั้งปี)$/.test(text)?12:'';
}
function taskDialog(staffId,id=''){
 const t=DB.tasks.find(x=>x.id===id)||{year:year(),category:'งานหลัก',project:'',duration:'',team:'',details:'',hours:'',count:1,frequency:'month'};
 modal(id?'แก้ไขเนื้องาน':'เพิ่มเนื้องาน',`<div class="grid"><div><label>ประเภทงาน</label><input id="tc" value="${esc(t.category)}"></div><div><label>ชื่อโครงการ/งาน *</label><input id="tp" value="${esc(t.project)}"></div><div><label>ระยะเวลาดำเนินงาน (จำนวนเดือน) *</label><input id="tdur" type="number" inputmode="decimal" min="0.01" max="12" step="any" value="${esc(suggestedMonths(t))}" placeholder="เช่น 3 หรือ 6 เดือน" oninput="previewHours()"><small>ใส่เฉพาะจำนวนเดือนที่ทำงานในปีที่เลือก (ไม่เกิน 12)</small></div><div><label>ทีมที่ร่วมงาน</label><input id="tt" value="${esc(t.team)}"></div><div><label>ชั่วโมงต่อครั้ง *</label><input id="th" type="number" inputmode="decimal" min="0" step="any" value="${esc(t.hours??'')}" oninput="previewHours()"></div><div><label>จำนวนครั้งต่อเดือน *</label><input id="tn" type="number" inputmode="decimal" min="0" step="any" value="${esc(monthlyCount(t))}" oninput="previewHours()"></div></div><label>รายละเอียด / ผลลัพธ์</label><textarea id="tde">${esc(t.details)}</textarea><div class="calculation" id="timePreview"></div><p class="muted">เวลาทำงานรวมในปีที่เลือก = ชั่วโมงต่อครั้ง × จำนวนครั้งต่อเดือน × จำนวนเดือนที่ดำเนินงาน<br>ตัวอย่าง 2 ชั่วโมง × 4 ครั้งต่อเดือน × 3 เดือน = 24 ชั่วโมง</p>${id&&t.durationMonths==null?`<p class="notice">ข้อมูลเดิมยังไม่ได้ยืนยันจำนวนเดือน${t.duration?' · ระยะเวลาเดิม: '+esc(t.duration):''} กรุณาตรวจจำนวนครั้งต่อเดือนและจำนวนเดือนที่ทำจริงก่อนบันทึก ยอดรวมจะคำนวณใหม่ตามข้อมูลนี้</p>`:''}`,`<button onclick="dlg.close()">ยกเลิก</button><button class="primary" onclick="saveTaskForm('${staffId}','${id}')">บันทึกเนื้องาน</button>`);previewHours();
}
function previewHours(){const h=$('#th').value,n=$('#tn').value,m=$('#tdur').value;const valid=h!==''&&n!==''&&m!==''&&Number(h)>=0&&Number(n)>=0&&Number(m)>0&&Number(m)<=12;$('#timePreview').textContent=valid?`${fmt(Number(h)*Number(n))} ชั่วโมง/เดือน × ${fmt(m)} เดือน = ${fmt(Math.round(Number(h)*Number(n)*Number(m)*100)/100)} ชั่วโมงรวม`:'กรอกเวลา จำนวนครั้งต่อเดือน และจำนวนเดือน (มากกว่า 0 ถึง 12) เพื่อคำนวณ'}
async function saveTaskForm(staffId,id){
 const hours=Number($('#th').value),count=Number($('#tn').value),durationMonths=Number($('#tdur').value);
 if(!$('#tp').value.trim())return toast('กรุณากรอกชื่อโครงการ/งาน');
 if($('#th').value===''||$('#tn').value===''||!Number.isFinite(hours)||!Number.isFinite(count)||hours<0||count<0)return toast('กรอกชั่วโมงและจำนวนครั้งเป็นตัวเลขตั้งแต่ 0 ขึ้นไป');
 if($('#tdur').value===''||!Number.isFinite(durationMonths)||durationMonths<=0||durationMonths>12)return toast('กรุณาระบุจำนวนเดือน มากกว่า 0 และไม่เกิน 12 เดือน');
 try{const old=DB.tasks.find(x=>x.id===id)||{};const t={...old,id:id||crypto.randomUUID(),staffId,year:old.year||year(),category:$('#tc').value.trim(),project:$('#tp').value.trim(),duration:String(durationMonths),durationMonths,team:$('#tt').value,details:$('#tde').value,hours,unit:'ชั่วโมง',count,frequency:'month',everyWeeks:1};await rpc('saveTask',t);dlg.close();detail()}catch(e){toast(e.message)}
}

async function removeTask(id){if(!confirm('ลบรายการงานนี้?'))return;try{await rpc('deleteTask',id);detail()}catch(e){toast(e.message)}} async function removeStaff(id){if(!DB.isAdmin)return adminGate(()=>removeStaff(id));if(!confirm('ลบชื่อและข้อมูลเจ้าหน้าที่นี้?'))return;try{await rpc('deleteStaff',id);selected=null;$('#settingsButton').hidden=!DB.isAdmin;render()}catch(e){toast(e.message)}}
function evaluationDialog(id,group){let label=group==='board'?'กรรมการ':'เจ้าหน้าที่';let groups=Object.keys(catLabel);let body=`<p class="notice">ให้คะแนนแต่ละข้อ: 4 ดีมาก · 3 ดี · 2 พอใช้ · 1 ปรับปรุง</p><p class="notice">กรอกชื่อผู้ประเมิน หากใช้ชื่อเดิมประเมินคนเดิม กลุ่มเดิม และปีเดิม ระบบจะแก้ไขคะแนนเดิม ชื่อนี้ไม่ได้ยืนยันตัวบุคคล</p><label>ชื่อผู้ประเมิน *</label><input id="reviewerName" maxlength="120" placeholder="ชื่อ-สกุล"><div class="scores">${groups.map(k=>`<section class="scoreGroup"><b>${catLabel[k]}</b>${cats[k].map((x,i)=>`<div class="rateRow"><span>${x}</span><div class="scoreChoices">${[[4,'ดีมาก'],[3,'ดี'],[2,'พอใช้'],[1,'ปรับปรุง']].map(([n,l])=>`<label title="${l}"><input type="radio" name="${k}_${i}" value="${n}"><span>${n}</span></label>`).join('')}</div></div>`).join('')}</section>`).join('')}</div><label>ความเห็นเพิ่มเติม</label><textarea id="evcomment"></textarea>`;modal(`${label}ประเมิน · ${staff(id).name}`,body,`<button onclick="dlg.close()">ยกเลิก</button><button class="primary" onclick="submitEvaluation('${id}','${group}')">ส่งแบบประเมิน</button>`)}
async function submitEvaluation(id,group){const evaluator=$('#reviewerName').value.trim();if(!evaluator)return toast('กรุณาระบุชื่อผู้ประเมิน');let scores={};for(let k of Object.keys(catLabel)){let arr=cats[k].map((_,i)=>Number($(`input[name="${k}_${i}"]:checked`)?.value));if(arr.some(x=>!x))return toast('กรุณาให้คะแนนทุกข้อ');scores[k]=arr.reduce((a,b)=>a+b,0)/arr.length}try{await rpc('saveReview',{targetId:id,year:year(),group,scores,evaluator,comment:$('#evcomment').value.trim()});dlg.close();detail()}catch(e){toast(e.message)}}
function settingsDialog(){if(!DB.isAdmin)return adminGate(()=>settingsDialog());let w=weights();modal('ตั้งค่าน้ำหนักคะแนน',`<p class="notice">น้ำหนักกลุ่มกรรมการและเจ้าหน้าที่ต้องรวมกันเท่ากับ 100%</p><div class="grid"><div><label>กรรมการ (%)</label><input id="wb" type="number" min="0" max="100" value="${w.board}" oninput="$('#ws').value=100-this.value"></div><div><label>เจ้าหน้าที่ (%)</label><input id="ws" type="number" min="0" max="100" value="${w.staff}" oninput="$('#wb').value=100-this.value"></div></div><p>ระดับคะแนน: 4 ดีมาก · 3 ดี · 2 พอใช้ · 1 ปรับปรุง</p><p>เกรดเริ่มต้น: A 90 · B+ 85 · B 80 · C+ 75 · C 70 · D ต่ำกว่า 70</p>`,`<button onclick="dlg.close()">ยกเลิก</button><button class="primary" onclick="saveWeights()">บันทึก</button>`)}
async function saveWeights(){let b=Number($('#wb').value),s=Number($('#ws').value);if(b<0||b>100||s<0||s>100||b+s!==100)return toast('น้ำหนักต้องอยู่ระหว่าง 0–100% และรวม 100%');try{await rpc('saveSettings',{board:b,staff:s});dlg.close();selected?detail():render()}catch(e){toast(e.message)}}
function photoPick(id){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{let f=i.files[0];if(!f)return;let im=new Image(),url=URL.createObjectURL(f);im.onload=async()=>{let c=document.createElement('canvas'),scale=Math.min(320/im.width,320/im.height,1);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{await rpc('savePhoto',id,c.toDataURL('image/jpeg',.78));detail()}catch(e){toast(e.message)}URL.revokeObjectURL(url)};im.src=url};i.click()}
function toast(s){if($('#dlg').open){let m=$('#dlg .form-message');if(!m){m=document.createElement('p');m.className='notice form-message';m.setAttribute('role','alert');$('#dlg .dlgbody').prepend(m)}m.textContent=s}let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
let afterAdmin=null;
function adminGate(next=showAdminPanel){if(DB.isAdmin){next();return}afterAdmin=next;modal('ผู้ดูแลระบบ',`<p>ใส่รหัสผู้ดูแลเพื่อจัดการรหัสส่วนตัวและค่าปรับคะแนน</p><label>รหัสผู้ดูแล</label><input id="adminPassword" type="password" inputmode="numeric" autocomplete="off">`,`<button onclick="dlg.close()">ยกเลิก</button><button class="primary" onclick="unlockAdmin()">ยืนยัน</button>`)}
async function unlockAdmin(){try{await rpc('adminLogin',$('#adminPassword').value);DB.isAdmin=true;dlg.close();const next=afterAdmin;afterAdmin=null;if(next)await next()}catch(e){toast(e.message)}}
async function showAdminPanel(){try{const rows=await rpc('getAdminRecords',year());modal('รหัสส่วนตัวและปรับคะแนน · ปี '+year(),`<p class="notice">รหัสด้านล่างเป็นความลับ ส่งให้เฉพาะเจ้าของรหัส ผู้ดูแลใช้หน้านี้ได้เป็นเวลา 15 นาที</p><button onclick="dlg.close();settingsDialog()">ตั้งค่าน้ำหนักคะแนน</button>${rows.map((r,i)=>`<section class="scoreGroup" style="margin-top:16px"><h3>${esc(r.name)}</h3><div class="grid"><div><label>รหัสดูผล 6 หลัก</label><input id="pin_${i}" value="${esc(r.pin)}" maxlength="6" inputmode="numeric" autocomplete="off"></div><div style="align-self:end"><button onclick="changePin('${r.id}',${i})">บันทึกรหัสใหม่</button></div></div><p class="muted">กรอกค่าปรับคะแนนพร้อมเครื่องหมาย เช่น ขาด -5, ลา +1, มาสาย -2 ช่องว่างนับเป็น 0 เมื่อกดบันทึก</p><div class="grid"><div><label>ขาด</label><input id="absent_${i}" type="number" step="any" value="${esc(r.adjustment.absent??'')}" placeholder="ยังไม่กรอก"></div><div><label>ลา</label><input id="leave_${i}" type="number" step="any" value="${esc(r.adjustment.leave??'')}" placeholder="ยังไม่กรอก"></div><div><label>มาสาย</label><input id="late_${i}" type="number" step="any" value="${esc(r.adjustment.late??'')}" placeholder="ยังไม่กรอก"></div></div><div class="actions"><button class="primary" onclick="submitAdjustment('${r.id}',${r.year},${i})">บันทึกค่าปรับคะแนน</button><button onclick="loadPrivateResult('${r.id}',${r.year},'')">ดูผลประเมิน</button></div><small id="adjustState_${i}">${r.adjustment.confirmed?'ยืนยันค่าขาด ลา มาสายแล้ว':'ยังไม่ได้ยืนยันค่าขาด ลา มาสาย'}</small></section>`).join('')}`)}catch(e){toast(e.message)}}
async function changePin(id,i){const pin=$('#pin_'+i).value;if(!/^\d{6}$/.test(pin))return toast('กรอกรหัสตัวเลข 6 หลัก');try{await rpc('setPrivatePin',id,pin);toast('บันทึกรหัสใหม่แล้ว')}catch(e){toast(e.message)}}
async function submitAdjustment(id,y,i){try{const v={targetId:id,year:y};for(const k of ['absent','leave','late']){const el=$('#'+k+'_'+i);if(el.validity.badInput)return toast('กรุณากรอกตัวเลขให้ถูกต้อง');v[k]=el.value===''?null:Number(el.value)}const saved=await rpc('saveAdjustment',v);if(!saved.adjustment?.confirmed)throw Error('ยังไม่ได้รับการยืนยันค่าปรับคะแนน');for(const k of ['absent','leave','late'])$('#'+k+'_'+i).value=saved.adjustment[k]??0;$('#adjustState_'+i).textContent='ยืนยันค่าขาด ลา มาสายแล้ว · ปี '+saved.year}catch(e){toast(e.message)}}
function resultsDialog(id){modal('ดูผลประเมิน · '+esc(staff(id).name),`<p>ใส่รหัสส่วนตัว 6 หลักของเจ้าหน้าที่รายนี้</p><label>รหัสดูผลประเมิน</label><input id="privatePin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">`,`<button onclick="dlg.close()">ยกเลิก</button><button class="primary" onclick="submitPrivatePin('${id}',${year()})">ดูผลประเมิน</button>`)}
function submitPrivatePin(id,y){const pin=$('#privatePin').value;if(!/^\d{6}$/.test(pin))return toast('กรุณากรอกรหัส 6 หลัก');loadPrivateResult(id,y,pin)}
async function loadPrivateResult(id,y,pin){try{const r=await rpc('getPrivateResult',id,y,pin);dlg.close();const signed=x=>x==null?(r.adjustment.confirmed?'0 (ยืนยันแล้ว)':'ยังไม่ได้ยืนยัน'):(x>=0?'+':'')+fmt(x);const part=(x,name)=>`<div><small>${name} · ${x?x.count:0} คน</small><b>${x?fmt(x.score):'—'}</b></div>`;modal('ผลประเมินส่วนตัว · '+esc(staff(id).name),`${r.base==null?'<p class="notice">ยังไม่มีคะแนนจากกลุ่มที่มีน้ำหนักสำหรับคำนวณ</p>':`<div class="summary">${part(r.b,'กรรมการ '+r.weights.board+'%')}${part(r.s,'เจ้าหน้าที่ '+r.weights.staff+'%')}<div><small>คะแนนก่อนปรับ</small><b>${fmt(r.base)}</b></div></div><div class="panel"><h3>ค่าปรับคะแนน</h3><p class="muted">${r.adjustment.confirmed?'ยืนยันค่าขาด ลา มาสายแล้ว':'ยังไม่ได้ยืนยันค่าขาด ลา มาสาย'}</p><p>ขาด: ${signed(r.adjustment.absent)}</p><p>ลา: ${signed(r.adjustment.leave)}</p><p>มาสาย: ${signed(r.adjustment.late)}</p><hr><p>${fmt(r.base)} ${r.delta>=0?'+':'−'} ${fmt(Math.abs(r.delta))} = <strong>${fmt(r.adjusted)} คะแนน</strong></p><h3>เกรด${r.provisional?'เบื้องต้น':'หลังปรับคะแนน'}: ${r.grade}</h3></div>${!r.adjustment.confirmed?'<p class="notice">ยังไม่ได้ยืนยันค่าขาด ลา มาสาย</p>':''}${(r.weights.board>0&&!r.b)||(r.weights.staff>0&&!r.s)?'<p class="notice">ยังรอคะแนนจากกลุ่มผู้ประเมินที่กำหนดน้ำหนัก ผลจึงเป็นคะแนนเบื้องต้น</p>':''}`}<p class="muted">เกณฑ์เดิม: A ≥ 90 · B+ ≥ 85 · B ≥ 80 · C+ ≥ 75 · C ≥ 70 · D ต่ำกว่า 70</p>`,`<button onclick="lockPrivateView()">ปิดและล็อกผลประเมิน</button>`);$('#dlg').addEventListener('close',clearPrivateView,{once:true})}catch(e){toast(e.message)}}
function clearPrivateView(){if(!$('#dlg').open)$('#dlg').innerHTML=''}
function lockPrivateView(){dlg.close();dlg.innerHTML=''}

$('#dlg').addEventListener('close',()=>{if(!$('#dlg').open)$('#dlg').innerHTML=''});
$('#busyDialog').addEventListener('cancel',e=>e.preventDefault());
init();
</script></body></html>
